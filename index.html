<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Piece – Live Watch Progress</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07111f;--card:#0d1b2d;--card2:#10243b;--text:#f4f7fb;--muted:#9fb0c4;--accent:#35c2ff;--gold:#ffd166;--line:#20364f;--ok:#72e6a0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#123152 0,#07111f 48%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{max-width:850px;margin:auto;padding:28px 16px 50px}.hero{text-align:center;margin-bottom:22px}.flag{font-size:42px}.hero h1{margin:4px 0;font-size:clamp(28px,7vw,46px)}.hero p{color:var(--muted);margin:0}
.panel{background:rgba(13,27,45,.94);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 12px 35px #0004}
.room{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.room .grow{flex:1;min-width:180px}
label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}input{background:#081522;color:var(--text);border:1px solid #2a435e;border-radius:12px;padding:11px 12px;width:100%;outline:none;font:inherit}input:focus{border-color:var(--accent)}
button{border:0;border-radius:12px;padding:11px 15px;background:var(--accent);color:#03101b;font:inherit;font-weight:800;cursor:pointer}button.secondary{background:#1a3048;color:var(--text)}button:active{transform:translateY(1px)}
.status{font-size:13px;color:var(--muted);margin-top:11px}.ok{color:var(--ok)}.warn{color:var(--gold)}
.players{display:grid;gap:14px}.player{background:linear-gradient(145deg,#0e2034,#0b1828);border:1px solid var(--line);border-radius:17px;padding:16px}.top{display:flex;justify-content:space-between;gap:10px;align-items:end}.name{font-size:20px;font-weight:800}.ep{font-size:27px;font-weight:900;color:var(--gold);white-space:nowrap}.bar{height:10px;background:#07111c;border-radius:99px;overflow:hidden;margin:12px 0}.fill{height:100%;background:linear-gradient(90deg,var(--accent),#77e1ff);border-radius:99px}.actions{display:flex;gap:8px}.actions button{flex:1}.small{font-size:12px;color:var(--muted);margin-top:8px}
.setup{display:grid;gap:10px}.setup code{background:#071522;padding:2px 5px;border-radius:5px}
.hidden{display:none!important}
@media(max-width:650px){.room button{width:100%}.actions button{padding:10px 8px}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><div class="flag">🏴‍☠️</div><h1>ONE PIECE</h1><p>Live Watch Progress</p></div>

<section id="configPanel" class="panel hidden">
  <h2>Einmalige Einrichtung</h2>
  <p>Trage deine Supabase-Projektwerte in <code>config.js</code> ein und lade die Seite neu.</p>
</section>

<section class="panel">
  <div class="room">
    <div class="grow"><label>Gemeinsamer Raum</label><input id="room" value="strawhats" maxlength="40"></div>
    <div class="grow"><label>Dein Name</label><input id="name" value="Richard" maxlength="30"></div>
    <button id="join">Raum betreten</button>
    <button id="share" class="secondary">🔗 Link teilen</button>
  </div>
  <div id="status" class="status">Verbinde…</div>
</section>

<section class="panel">
  <div id="players" class="players"></div>
</section>
</div>

<script src="config.js"></script>
<script>
const MAX_EP=1200;
const cfg=window.OP_CONFIG||{};
const statusEl=document.getElementById('status');
let client=null, channel=null, room='strawhats', me='Richard', rows={};

function setStatus(t,c=''){statusEl.className='status '+c;statusEl.textContent=t}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function render(){
 const vals=Object.values(rows).sort((a,b)=>b.episode-a.episode);
 if(!vals.length){document.getElementById('players').innerHTML='<div class="small">Noch niemand im Raum. Trag deinen Fortschritt ein.</div>';return}
 document.getElementById('players').innerHTML=vals.map(p=>{
   const pct=Math.min(100,p.episode/MAX_EP*100);
   const mine=p.name===me;
   return `<article class="player">
    <div class="top"><div class="name">👤 ${esc(p.name)} ${mine?'(du)':''}</div><div class="ep">Folge ${p.episode}</div></div>
    <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
    <div class="actions">${mine?`<button class="secondary" onclick="change(-1)">− 1</button><button onclick="change(1)">+ 1 Folge</button><button class="secondary" onclick="setEpisode()">✏️ Setzen</button>`:'<div class="small">Live synchronisiert</div>'}</div>
    <div class="small">Zuletzt geändert: ${new Date(p.updated_at).toLocaleString('de-DE')}</div>
   </article>`
 }).join('');
}

async function loadRoom(){
 if(!client)return;
 room=(document.getElementById('room').value.trim()||'strawhats').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,40);
 me=(document.getElementById('name').value.trim()||'Spieler').slice(0,30);
 history.replaceState(null,'',location.pathname+'?room='+encodeURIComponent(room));
 rows={};
 const {data,error}=await client.from('watch_progress').select('*').eq('room',room);
 if(error){setStatus('Fehler beim Laden: '+error.message,'warn');return}
 (data||[]).forEach(x=>rows[x.name]=x);
 // Beim ersten Betreten wird der eigene Eintrag mit Folge 0 angelegt,
 // damit der Spieler sofort eine Karte mit den Fortschritts-Buttons sieht.
 if(!rows[me]){
   const {data:created,error:createError}=await client.from('watch_progress')
     .upsert({room,name:me,episode:0,updated_at:new Date().toISOString()},{onConflict:'room,name'})
     .select().single();
   if(createError){setStatus('Beitreten fehlgeschlagen: '+createError.message,'warn');return}
   rows[me]=created;
 }
 render();
 if(channel) await client.removeChannel(channel);
 channel=client.channel('watch-'+room);
 channel.on('postgres_changes',{event:'*',schema:'public',table:'watch_progress',filter:'room=eq.'+room},payload=>{
   if(payload.eventType==='DELETE') delete rows[payload.old.name];
   else rows[payload.new.name]=payload.new;
   render();
 }).subscribe(s=>{if(s==='SUBSCRIBED')setStatus('🟢 Live verbunden – Änderungen erscheinen sofort.','ok');});
}

async function change(delta){
 const current=rows[me]?.episode||0;
 await upsert(Math.max(0,Math.min(MAX_EP,current+delta)));
}
async function setEpisode(){
 const v=prompt('Bis zu welcher Folge?',rows[me]?.episode||0);
 if(v!==null && /^\d+$/.test(v)) await upsert(Math.max(0,Math.min(MAX_EP,Number(v))));
}
async function upsert(episode){
 const {error}=await client.from('watch_progress').upsert({room,name:me,episode,updated_at:new Date().toISOString()},{onConflict:'room,name'});
 if(error)setStatus('Speichern fehlgeschlagen: '+error.message,'warn');
}
document.getElementById('join').onclick=loadRoom;
document.getElementById('share').onclick=()=>navigator.clipboard?.writeText(location.href).then(()=>setStatus('Link kopiert – schick ihn deinen Kumpels.','ok'));

(async()=>{
 const params=new URLSearchParams(location.search);
 if(params.get('room'))document.getElementById('room').value=params.get('room');
 if(!cfg.url||!cfg.key){document.getElementById('configPanel').classList.remove('hidden');setStatus('Supabase noch nicht eingerichtet.','warn');return}
 client=supabase.createClient(cfg.url,cfg.key);
 await loadRoom();
})();
</script>
</body>
</html>
